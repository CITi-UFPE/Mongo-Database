server {
    listen 80;
    server_name _;
    charset utf-8;
    charset_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ Headers de segurança para resolver Cross-Origin-Opener-Policy issues com Google Auth
    # COOP: Permite que a página seja aberta em contexto de popup (necessário para Google Auth)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    
    # COEP: Controla o compartilhamento de recursos cross-origin
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    
    # P3P: Platform for Privacy Preferences (deprecated mas alguns navegadores ainda usam)
    add_header P3P 'CP="IDC DSP COR ADM DEVi TAIi PSA PSD IVAi IVDi CONi HIS OUR OTRo SAMi BUS PHY ONL UNI PUR FIN COM NAV INT DEM CNT STA POL HEA PRE LOC GOV"' always;
    
    # Permissões da API: autoriza a origem do backend em requisições CORS
    add_header Access-Control-Allow-Credentials "true" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
}
